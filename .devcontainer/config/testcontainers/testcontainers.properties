# ---------------------------------------------------------------------------
# Testcontainers-Konfiguration fuer den Dev Container.
#
# Wird beim Start nach ~/.testcontainers.properties KOPIERT (nicht verlinkt),
# weil Testcontainers selbst in die Datei schreibt. Nach Aenderungen:
#   devkit config link
#
# Der Docker-Daemon laeuft im Container (Docker-in-Docker) - Testcontainers
# findet ihn ohne Zusatzkonfiguration ueber /var/run/docker.sock.
# ---------------------------------------------------------------------------

# Container zwischen Testlaeufen wiederverwenden. Wirkt nur fuer Container, die
# im Code ausdruecklich .withReuse(true) setzen, spart dort aber den Startvorgang.
testcontainers.reuse.enable=true

# --- Docker-Hub-Rate-Limits umgehen ----------------------------------------
# Praefix fuer alle Images, die sonst von docker.io kaemen - inklusive der
# internen Helfer-Images (Ryuk, tiny image). Mit Schraegstrich am Ende!
# Benoetigt Testcontainers 1.19+.
#
# GitLab Dependency Proxy (Gruppenebene, docker login erforderlich):
#hub.image.name.prefix=gitlab.example.com/meine-gruppe/dependency_proxy/containers/
#
# Nexus/Artifactory/Harbor Pull-Through-Cache:
#hub.image.name.prefix=nexus.example.com:8082/

# Alternativ pro Helfer-Image, falls nur einzelne umgebogen werden sollen:
#ryuk.container.image=nexus.example.com:8082/testcontainers/ryuk:0.11.0
#tinyimage.container.image=nexus.example.com:8082/alpine:3.17

# --- Sonstiges -------------------------------------------------------------
# Ryuk raeumt haengengebliebene Container auf. Nur abschalten, wenn die
# Umgebung keine privilegierten Sidecars zulaesst.
#ryuk.disabled=false

# Startup-Checks ueberspringen (spart wenige Sekunden, verschleiert aber Fehler).
#checks.disable=false
